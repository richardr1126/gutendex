# The live copy is in the k3s-cluster repo (argocd/apps/gutendex.yaml), deployed by its app of
# apps; keep the two in sync. Project `apps`: the cluster's default project is locked down.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gutendex
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: https://github.com/richardr1126/gutendex
    targetRevision: master
    path: charts/gutendex
    helm:
      # Pinned rather than left to default to the Application's name: the API
      # finds the database at `<release>-db-rw`, so renaming the
      # Application must not rename the release.
      releaseName: gutendex
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - PruneLast=true
